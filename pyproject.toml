[project]
name = "google-fonts-ttc"
version = "0.1.0"
description = "Technical experiment: package Google Fonts into TrueType Collections"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["fonttools>=4.63.0", "uharfbuzz>=0.56.0"]

[dependency-groups]
dev = ["ruff>=0.16.3", "ty>=0.0.72"]

[tool.ruff]
line-length = 100

[tool.ty.rules]
unresolved-attribute = "ignore"
